services:
  db:
    image: postgres:16
    container_name: car-marketplace-db
    environment:
      POSTGRES_USER: caruser
      POSTGRES_PASSWORD: carpass
      POSTGRES_DB: car_marketplace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caruser -d car_marketplace"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
